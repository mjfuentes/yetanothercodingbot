<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Monitoring Dashboard</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #151922;
            --bg-tertiary: #1e2430;
            --text-primary: #e4e6eb;
            --text-secondary: #a8adb7;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-purple: #8b5cf6;
            --border-color: #2d3748;
            --shadow: rgba(0, 0, 0, 0.3);
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1.25rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
        }

        .btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-blue);
        }

        .btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .refresh-indicator {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            background: var(--bg-secondary);
            padding: 0.625rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            display: none;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--bg-tertiary);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            margin-bottom: 1rem;
        }

        .card-icon {
            width: 2rem;
            height: 2rem;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .icon-api { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        .icon-tasks { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }
        .icon-tools { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .icon-health { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .metrics {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .metric-value {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .value-cost { color: var(--accent-blue); }
        .value-success { color: var(--accent-green); }
        .value-error { color: var(--accent-red); }

        .model-breakdown {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .model-item {
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 0.375rem;
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .model-name {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .model-cost {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .model-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .tool-list {
            max-height: 280px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .tool-list::-webkit-scrollbar {
            width: 6px;
        }

        .tool-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .tool-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .tool-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.625rem;
            margin-bottom: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 0.375rem;
        }

        .tool-item:last-child {
            margin-bottom: 0;
        }

        .tool-name {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .tool-stats {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .error-list {
            max-height: 240px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .error-list::-webkit-scrollbar {
            width: 6px;
        }

        .error-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .error-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .error-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid var(--accent-red);
            border-radius: 0.25rem;
        }

        .error-item:last-child {
            margin-bottom: 0;
        }

        .error-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .error-message {
            font-size: 0.875rem;
        }

        .no-errors {
            color: var(--accent-green);
            text-align: center;
            padding: 1.5rem;
            font-weight: 500;
        }

        .no-data {
            color: var(--text-muted);
            text-align: center;
            padding: 1.5rem;
        }

        .chart-container {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
            min-height: 400px;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        #chart {
            width: 100%;
            height: 350px;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bot Monitoring Dashboard</h1>
            <p class="subtitle">Real-time metrics for Claude API usage, tasks, and tool execution</p>
        </header>

        <div class="controls">
            <button class="btn active" onclick="setTimeRange(24)">24 Hours</button>
            <button class="btn" onclick="setTimeRange(168)">7 Days</button>
            <button class="btn" onclick="setTimeRange(720)">30 Days</button>
            <button class="btn" onclick="refreshData()">Refresh</button>
        </div>

        <div class="refresh-indicator" id="refreshIndicator">
            <div class="spinner"></div>
            <span>Updating...</span>
        </div>

        <div class="grid" id="metricsGrid">
            <div class="card">
                <div class="loading">Loading metrics...</div>
            </div>
        </div>

        <div class="chart-container">
            <h2 class="chart-title">Activity Timeline</h2>
            <canvas id="chart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        let currentTimeRange = 24;
        let chart = null;
        let refreshInterval = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadMetrics();
            startAutoRefresh();
        });

        function setTimeRange(hours) {
            currentTimeRange = hours;
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadMetrics();
        }

        async function loadMetrics() {
            showRefreshIndicator();

            try {
                const response = await fetch(`/api/metrics/overview?hours=${currentTimeRange}`);
                const data = await response.json();

                renderMetrics(data);
                await renderChart();
            } catch (error) {
                console.error('Error loading metrics:', error);
                showError('Failed to load metrics. Please try again.');
            } finally {
                hideRefreshIndicator();
            }
        }

        function renderMetrics(data) {
            const grid = document.getElementById('metricsGrid');

            grid.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon icon-api">API</div>
                        <h2 class="card-title">Claude API Usage</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Cost</span>
                            <span class="metric-value value-cost">$${data.claude_api_usage.total_cost.toFixed(2)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Total Requests</span>
                            <span class="metric-value">${data.claude_api_usage.total_requests.toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Recent (${currentTimeRange}h)</span>
                            <span class="metric-value">${data.claude_api_usage.recent_requests.toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Recent Cost</span>
                            <span class="metric-value value-cost">$${data.claude_api_usage.recent_cost.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="model-breakdown">
                        ${renderModelBreakdown(data.claude_api_usage.model_breakdown)}
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon icon-tasks">TK</div>
                        <h2 class="card-title">Task Execution</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Tasks</span>
                            <span class="metric-value">${data.task_statistics.total_tasks.toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Success Rate</span>
                            <span class="metric-value value-success">${data.task_statistics.success_rate.toFixed(1)}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Completed</span>
                            <span class="metric-value value-success">${data.task_statistics.by_status.completed}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Failed</span>
                            <span class="metric-value value-error">${data.task_statistics.by_status.failed}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">In Progress</span>
                            <span class="metric-value">${data.task_statistics.by_status.in_progress}</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon icon-tools">TL</div>
                        <h2 class="card-title">Tool Usage</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Tool Calls</span>
                            <span class="metric-value">${data.tool_usage.total_tool_calls.toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="tool-list">
                        ${renderTopTools(data.tool_usage.most_used_tools)}
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon icon-health">SH</div>
                        <h2 class="card-title">System Health</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Active Tasks</span>
                            <span class="metric-value">${data.system_health.active_tasks_count}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Errors (24h)</span>
                            <span class="metric-value value-error">${data.system_health.recent_errors_24h}</span>
                        </div>
                    </div>
                    <div class="error-list">
                        ${renderRecentErrors(data.system_health.recent_errors)}
                    </div>
                </div>
            `;
        }

        function renderModelBreakdown(models) {
            if (!models || Object.keys(models).length === 0) {
                return '<div class="no-data">No data available</div>';
            }

            return Object.entries(models).map(([model, stats]) => `
                <div class="model-item">
                    <div class="model-header">
                        <span class="model-name">${model}</span>
                        <span class="model-cost">$${stats.cost.toFixed(2)}</span>
                    </div>
                    <div class="model-details">
                        <div>${stats.requests} requests</div>
                        <div>${(stats.input_tokens / 1000).toFixed(1)}K in</div>
                        <div>${(stats.output_tokens / 1000).toFixed(1)}K out</div>
                        <div>${((stats.input_tokens + stats.output_tokens) / 1000).toFixed(1)}K total</div>
                    </div>
                </div>
            `).join('');
        }

        function renderTopTools(tools) {
            if (!tools || tools.length === 0) {
                return '<div class="no-data">No tool usage data</div>';
            }

            return tools.slice(0, 5).map(tool => `
                <div class="tool-item">
                    <div>
                        <div class="tool-name">${tool.tool}</div>
                        <div class="tool-stats">
                            ${tool.count} calls • ${(tool.success_rate * 100).toFixed(0)}% success
                        </div>
                    </div>
                    <div class="tool-stats">
                        ${tool.avg_duration_ms.toFixed(0)}ms
                    </div>
                </div>
            `).join('');
        }

        function renderRecentErrors(errors) {
            if (!errors || errors.length === 0) {
                return '<div class="no-errors">No recent errors</div>';
            }

            return errors.slice(0, 3).map(error => `
                <div class="error-item">
                    <div class="error-time">${new Date(error.timestamp).toLocaleString()} • Task #${error.task_id}</div>
                    <div class="error-message">${error.error}</div>
                </div>
            `).join('');
        }

        async function renderChart() {
            try {
                const response = await fetch(`/api/metrics/timeseries?hours=${currentTimeRange}&interval=60`);
                const timeseriesData = await response.json();

                const ctx = document.getElementById('chart').getContext('2d');

                if (chart) {
                    chart.destroy();
                }

                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timeseriesData.data_points.map(d => {
                            const date = new Date(d.timestamp);
                            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        }),
                        datasets: [
                            {
                                label: 'API Requests',
                                data: timeseriesData.data_points.map(d => d.requests),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                tension: 0.4,
                                fill: true,
                                borderWidth: 2
                            },
                            {
                                label: 'Tasks Completed',
                                data: timeseriesData.data_points.map(d => d.tasks_completed),
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                tension: 0.4,
                                fill: true,
                                borderWidth: 2
                            },
                            {
                                label: 'Tasks Failed',
                                data: timeseriesData.data_points.map(d => d.tasks_failed),
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                tension: 0.4,
                                fill: true,
                                borderWidth: 2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    color: '#e4e6eb',
                                    padding: 15,
                                    font: {
                                        size: 12
                                    }
                                }
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                backgroundColor: '#1e2430',
                                titleColor: '#e4e6eb',
                                bodyColor: '#a8adb7',
                                borderColor: '#2d3748',
                                borderWidth: 1,
                                padding: 12,
                                displayColors: true
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0,
                                    color: '#a8adb7'
                                },
                                grid: {
                                    color: '#2d3748',
                                    drawBorder: false
                                }
                            },
                            x: {
                                ticks: {
                                    color: '#a8adb7',
                                    maxRotation: 0
                                },
                                grid: {
                                    color: '#2d3748',
                                    drawBorder: false
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error rendering chart:', error);
            }
        }

        function startAutoRefresh() {
            refreshInterval = setInterval(loadMetrics, 30000);
        }

        function refreshData() {
            loadMetrics();
        }

        function showRefreshIndicator() {
            document.getElementById('refreshIndicator').style.display = 'flex';
        }

        function hideRefreshIndicator() {
            document.getElementById('refreshIndicator').style.display = 'none';
        }

        function showError(message) {
            const grid = document.getElementById('metricsGrid');
            grid.innerHTML = `
                <div class="card" style="grid-column: 1 / -1;">
                    <div style="color: var(--accent-red); text-align: center; padding: 2rem;">
                        <h2>Error</h2>
                        <p style="margin-top: 0.5rem; color: var(--text-secondary);">${message}</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
