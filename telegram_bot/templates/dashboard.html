<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Monitoring Dashboard</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #151922;
            --bg-tertiary: #1e2430;
            --text-primary: #e4e6eb;
            --text-secondary: #a8adb7;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-purple: #8b5cf6;
            --border-color: #2d3748;
            --shadow: rgba(0, 0, 0, 0.3);
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1.25rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
        }

        .btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-blue);
        }

        .btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .refresh-indicator {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            background: var(--bg-secondary);
            padding: 0.625rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            display: none;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .auto-refresh-status {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            background: var(--bg-secondary);
            padding: 0.625rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .auto-refresh-status.updating {
            display: none;
        }

        .refresh-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        .refresh-toggle input {
            cursor: pointer;
        }

        .refresh-countdown {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--bg-tertiary);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            margin-bottom: 1rem;
        }

        .card-icon {
            width: 2rem;
            height: 2rem;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .icon-api { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        .icon-tasks { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }
        .icon-tools { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .icon-health { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .metrics {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .metric-value {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .value-cost { color: var(--accent-blue); }
        .value-success { color: var(--accent-green); }
        .value-error { color: var(--accent-red); }

        .model-breakdown {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .model-item {
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 0.375rem;
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .model-name {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .model-cost {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .model-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .tool-list {
            max-height: 280px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .tool-list::-webkit-scrollbar {
            width: 6px;
        }

        .tool-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .tool-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .tool-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.625rem;
            margin-bottom: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 0.375rem;
        }

        .tool-item:last-child {
            margin-bottom: 0;
        }

        .tool-name {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .tool-stats {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .error-list {
            max-height: 240px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .error-list::-webkit-scrollbar {
            width: 6px;
        }

        .error-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .error-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .error-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid var(--accent-red);
            border-radius: 0.25rem;
        }

        .error-item:last-child {
            margin-bottom: 0;
        }

        .error-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .error-message {
            font-size: 0.875rem;
        }

        .no-errors {
            color: var(--accent-green);
            text-align: center;
            padding: 1.5rem;
            font-weight: 500;
        }

        .no-data {
            color: var(--text-muted);
            text-align: center;
            padding: 1.5rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bot Monitoring Dashboard</h1>
            <p class="subtitle">Real-time metrics for Claude API usage, tasks, and tool execution</p>
        </header>

        <div class="controls">
            <button class="btn active" onclick="setTimeRange(24)">24 Hours</button>
            <button class="btn" onclick="setTimeRange(168)">7 Days</button>
            <button class="btn" onclick="setTimeRange(720)">30 Days</button>
            <button class="btn" onclick="refreshData()">Refresh Now</button>
            <a href="/telegram" target="_blank" class="btn" style="margin-left: auto;">💬 Open Telegram</a>
        </div>

        <div class="refresh-indicator" id="refreshIndicator">
            <div class="spinner"></div>
            <span>Updating...</span>
        </div>

        <div class="auto-refresh-status" id="autoRefreshStatus">
            <label class="refresh-toggle">
                <input type="checkbox" id="autoRefreshToggle" checked onchange="toggleAutoRefresh()">
                <span>Auto-refresh</span>
            </label>
            <span class="refresh-countdown" id="refreshCountdown">30s</span>
        </div>

        <div class="grid" id="metricsGrid">
            <div class="card">
                <div class="loading">Loading metrics...</div>
            </div>
        </div>
    </div>

    <script>
        let currentTimeRange = 24;
        let refreshInterval = null;
        let countdownInterval = null;
        let autoRefreshEnabled = true;
        let nextRefreshTime = null;
        const REFRESH_INTERVAL_MS = 30000; // 30 seconds

        document.addEventListener('DOMContentLoaded', () => {
            loadMetrics();
            startAutoRefresh();
        });

        function setTimeRange(hours) {
            currentTimeRange = hours;
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadMetrics();
        }

        async function loadMetrics() {
            showRefreshIndicator();

            try {
                const response = await fetch(`/api/metrics/overview?hours=${currentTimeRange}`);
                const data = await response.json();

                // Also fetch Usage API data
                const usageApiResponse = await fetch('/api/metrics/usage-api');
                const usageApiData = await usageApiResponse.json();

                renderMetrics(data, usageApiData);
            } catch (error) {
                console.error('Error loading metrics:', error);
                showError('Failed to load metrics. Please try again.');
            } finally {
                hideRefreshIndicator();
            }
        }

        function renderMetrics(data, usageApiData) {
            const grid = document.getElementById('metricsGrid');

            // Build Usage API card if configured
            let usageApiCard = '';
            if (usageApiData && usageApiData.configured) {
                usageApiCard = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon" style="background: rgba(236, 72, 153, 0.15); color: #ec4899;">🔗</div>
                            <h2 class="card-title">Anthropic Usage API</h2>
                        </div>
                        <div class="metrics">
                            <div class="metric">
                                <span class="metric-label">Total Cost (Month)</span>
                                <span class="metric-value value-cost">$${usageApiData.total_cost.toFixed(2)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Total Tokens</span>
                                <span class="metric-value">${(usageApiData.total_tokens / 1000000).toFixed(2)}M</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Input Tokens</span>
                                <span class="metric-value">${(usageApiData.total_input_tokens / 1000000).toFixed(2)}M</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Output Tokens</span>
                                <span class="metric-value">${(usageApiData.total_output_tokens / 1000000).toFixed(2)}M</span>
                            </div>
                            ${usageApiData.total_cached_tokens > 0 ? `
                            <div class="metric">
                                <span class="metric-label">Cached Tokens</span>
                                <span class="metric-value">${(usageApiData.total_cached_tokens / 1000000).toFixed(2)}M</span>
                            </div>
                            ` : ''}
                        </div>
                        ${renderUsageApiModels(usageApiData.model_breakdown)}
                    </div>
                `;
            }

            grid.innerHTML = `
                ${usageApiCard}
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon icon-api">API</div>
                        <h2 class="card-title">Local Tracking</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Cost</span>
                            <span class="metric-value value-cost">$${data.claude_api_usage.total_cost.toFixed(2)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Total Requests</span>
                            <span class="metric-value">${data.claude_api_usage.total_requests.toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Recent (${currentTimeRange}h)</span>
                            <span class="metric-value">${data.claude_api_usage.recent_requests.toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Recent Cost</span>
                            <span class="metric-value value-cost">$${data.claude_api_usage.recent_cost.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="model-breakdown">
                        ${renderModelBreakdown(data.claude_api_usage.model_breakdown)}
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon icon-tasks">TK</div>
                        <h2 class="card-title">Task Execution</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Tasks</span>
                            <span class="metric-value">${data.task_statistics.total_tasks.toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Success Rate</span>
                            <span class="metric-value value-success">${data.task_statistics.success_rate.toFixed(1)}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Completed</span>
                            <span class="metric-value value-success">${data.task_statistics.by_status.completed}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Failed</span>
                            <span class="metric-value value-error">${data.task_statistics.by_status.failed}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">In Progress</span>
                            <span class="metric-value">${data.task_statistics.by_status.in_progress}</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon icon-tools">TL</div>
                        <h2 class="card-title">Tool Usage</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Tool Calls</span>
                            <span class="metric-value">${data.tool_usage.total_tool_calls.toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="tool-list">
                        ${renderTopTools(data.tool_usage.most_used_tools)}
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon icon-health">SH</div>
                        <h2 class="card-title">System Health</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Active Tasks</span>
                            <span class="metric-value">${data.system_health.active_tasks_count}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Errors (24h)</span>
                            <span class="metric-value value-error">${data.system_health.recent_errors_24h}</span>
                        </div>
                    </div>
                    <div class="error-list">
                        ${renderRecentErrors(data.system_health.recent_errors)}
                    </div>
                </div>
            `;
        }

        function renderUsageApiModels(models) {
            if (!models || Object.keys(models).length === 0) {
                return '';
            }

            return `
                <div class="model-breakdown">
                    ${Object.entries(models).map(([model, stats]) => `
                        <div class="model-item">
                            <div class="model-header">
                                <span class="model-name">${model}</span>
                            </div>
                            <div class="model-details">
                                <div>${(stats.input_tokens / 1000).toFixed(0)}K in</div>
                                <div>${(stats.output_tokens / 1000).toFixed(0)}K out</div>
                                ${stats.cached_tokens > 0 ? `<div>${(stats.cached_tokens / 1000).toFixed(0)}K cached</div>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderModelBreakdown(models) {
            if (!models || Object.keys(models).length === 0) {
                return '<div class="no-data">No data available</div>';
            }

            return Object.entries(models).map(([model, stats]) => `
                <div class="model-item">
                    <div class="model-header">
                        <span class="model-name">${model}</span>
                        <span class="model-cost">$${stats.cost.toFixed(2)}</span>
                    </div>
                    <div class="model-details">
                        <div>${stats.requests} requests</div>
                        <div>${(stats.input_tokens / 1000).toFixed(1)}K in</div>
                        <div>${(stats.output_tokens / 1000).toFixed(1)}K out</div>
                        <div>${((stats.input_tokens + stats.output_tokens) / 1000).toFixed(1)}K total</div>
                    </div>
                </div>
            `).join('');
        }

        function renderTopTools(tools) {
            if (!tools || tools.length === 0) {
                return '<div class="no-data">No tool usage data</div>';
            }

            return tools.slice(0, 5).map(tool => `
                <div class="tool-item">
                    <div>
                        <div class="tool-name">${tool.tool}</div>
                        <div class="tool-stats">
                            ${tool.count} calls • ${(tool.success_rate * 100).toFixed(0)}% success
                        </div>
                    </div>
                    <div class="tool-stats">
                        ${tool.avg_duration_ms.toFixed(0)}ms
                    </div>
                </div>
            `).join('');
        }

        function renderRecentErrors(errors) {
            if (!errors || errors.length === 0) {
                return '<div class="no-errors">No recent errors</div>';
            }

            return errors.slice(0, 3).map(error => `
                <div class="error-item">
                    <div class="error-time">${new Date(error.timestamp).toLocaleString()} • Task #${error.task_id}</div>
                    <div class="error-message">${error.error}</div>
                </div>
            `).join('');
        }

        function startAutoRefresh() {
            if (!autoRefreshEnabled) return;

            // Clear any existing intervals
            if (refreshInterval) clearInterval(refreshInterval);
            if (countdownInterval) clearInterval(countdownInterval);

            // Set next refresh time
            nextRefreshTime = Date.now() + REFRESH_INTERVAL_MS;

            // Start refresh interval
            refreshInterval = setInterval(() => {
                loadMetrics();
                nextRefreshTime = Date.now() + REFRESH_INTERVAL_MS;
            }, REFRESH_INTERVAL_MS);

            // Start countdown display
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            document.getElementById('refreshCountdown').textContent = '--';
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = document.getElementById('autoRefreshToggle').checked;

            if (autoRefreshEnabled) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function updateCountdown() {
            if (!autoRefreshEnabled || !nextRefreshTime) return;

            const remaining = Math.max(0, Math.ceil((nextRefreshTime - Date.now()) / 1000));
            document.getElementById('refreshCountdown').textContent = `${remaining}s`;
        }

        function refreshData() {
            loadMetrics();
            // Reset countdown after manual refresh
            if (autoRefreshEnabled) {
                nextRefreshTime = Date.now() + REFRESH_INTERVAL_MS;
                updateCountdown();
            }
        }

        function showRefreshIndicator() {
            document.getElementById('refreshIndicator').style.display = 'flex';
            document.getElementById('autoRefreshStatus').classList.add('updating');
        }

        function hideRefreshIndicator() {
            document.getElementById('refreshIndicator').style.display = 'none';
            document.getElementById('autoRefreshStatus').classList.remove('updating');
        }

        function showError(message) {
            const grid = document.getElementById('metricsGrid');
            grid.innerHTML = `
                <div class="card" style="grid-column: 1 / -1;">
                    <div style="color: var(--accent-red); text-align: center; padding: 2rem;">
                        <h2>Error</h2>
                        <p style="margin-top: 0.5rem; color: var(--text-secondary);">${message}</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
